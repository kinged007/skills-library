notes: 'Reference to upstream (MIT). Rated after reading SKILL.md. The floor is enforceable rather than advisory: every colour and font through a :root token, never transition:all, overflow-x clip not hidden, minmax(0,1fr) on image tracks, focus-visible, prefers-reduced-motion fallbacks, no invented metrics or testimonials. Each rule cites a numbered design principle, so a violation can be argued from the source. Claims Together AI support. Closest neighbour here is frontend-ui-engineering (Addy), which covers structure rather than visual taste.'
