notes: 'Reference to upstream (MIT). Rated after reading SKILL.md and its conventions, execute and track references. Five phases (plan, structure, sync, execute, track) with 16 bash scripts so status, standup, next and blocked are computed rather than improvised. Requires an authenticated gh CLI and a project-local .claude/ tree; the scripts run from the project root. Distinct from the roadmap and prd-writing skills here: those produce the artifact, this one tracks it to shipped code.'
