notes: 'Reference to upstream (MIT, Cathryn Lavery). Rated after reading SKILL.md and its references. Strongest diagram skill reviewed: 52 visual types, 72 reference files, anti-slop rules that are testable rather than taste-talk. Earns the 5 for three things: a gate that stops and asks you to brand the style guide before emitting if tokens are still defaults; a rule that resolves the semantic pattern before the layout type; and a pre-output taste gate naming the failure. Imports draw.io, Mermaid, Excalidraw and PlantUML. Heavy: use when the diagram is the deliverable.'
