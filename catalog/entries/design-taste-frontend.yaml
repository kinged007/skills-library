notes: 'Reference to upstream (MIT). Rated after reading SKILL.md and its hooks block. Ships a real enforcement step rather than prose: a stop hook runs scripts/gate.mjs against the build in a browser and records it under .taste-skill/, so ''is it good'' becomes a pass or fail. The hook assumes a Claude Code style hook surface and the gate path must exist, so it degrades to a warning if the runtime lacks hooks. Overlaps hallmark on intent; differs by targeting whole company sites and photograph rules rather than a rule floor.'
