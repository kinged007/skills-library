name: validate
on: [push, pull_request]
jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pyyaml && python scripts/build_site.py
      - name: generated catalog data up to date
        # generated_at changes on every build, so compare everything except that line
        run: |
          git diff --exit-code catalog.json
          diff <(grep -v '"generated_at"' docs/catalog.json) \
               <(git show HEAD:docs/catalog.json | grep -v '"generated_at"')
